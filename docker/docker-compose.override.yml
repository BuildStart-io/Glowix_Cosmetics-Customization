# BuildStart.io customizations — layered on top of the official docker-compose.yml
# Loaded automatically by docker compose.

services:
  studio:
    # Expose Studio on host port 3030 by default (change using STUDIO_PORT env var)
    ports:
      - "${STUDIO_PORT:-3030}:3000"

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-buildstart_waha_local_secret_12345}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_ZIPPER: ZIPUNZIP
    volumes:
      - waha_data:/app/.sessions
      - ./waha_patches/Utils.js:/app/node_modules/whatsapp-web.js/src/util/Injected/Utils.js:ro

  functions:
    environment:
      # ── BuildStart.io edge function secrets ──────────────────────────────────
      AI_GENERATE_URL: ${AI_GENERATE_URL}
      BOT_API_KEY: ${BOT_API_KEY}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-buildstart_waha_local_secret_12345}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      WEBHOOK_URL_OVERRIDE: "http://supabase-envoy:8000/functions/v1/webhook-wsender-Glowix_cosmetics"

volumes:
  waha_data:
